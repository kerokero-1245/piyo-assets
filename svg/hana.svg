    <path d="M100,150 L100,184"/>
    <path d="M100,150 C124,152 142,138 141,116 Q112,120 100,144 Z"/>
    <ellipse cx="100" cy="52" rx="9" ry="18" transform="rotate(0 100 84)"/>
