  <g fill="#FFD4E4" stroke="#3d2a1c" stroke-width="2.6" stroke-linejoin="round">
    <ellipse cx="100" cy="52" rx="9" ry="18" transform="rotate(0 100 84)"/>
    <ellipse cx="100" cy="52" rx="9" ry="18" transform="rotate(36 100 84)"/>
    <ellipse cx="100" cy="52" rx="9" ry="18" transform="rotate(72 100 84)"/>
    <ellipse cx="100" cy="52" rx="9" ry="18" transform="rotate(108 100 84)"/>
