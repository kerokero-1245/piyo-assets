<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ねむいぴよ">
  <g transform="rotate(-6 100 118)">
    <!-- white die-cut underlay -->
    <g fill="#ffffff" stroke="#ffffff" stroke-width="15" stroke-linejoin="round" stroke-linecap="round">
      <path d="M86,66 Q84,50 93,54 Q98,46 103,54 Q112,50 110,66 Z"/>
      <path d="M84,156 L84,178 M84,178 L76,184 M84,178 L92,184 M84,178 L84,186"/>
      <path d="M116,156 L116,178 M116,178 L108,184 M116,178 L124,184 M116,178 L116,186"/>
      <ellipse cx="100" cy="116" rx="54" ry="52"/>
      <path d="M52,112 Q38,120 44,138 Q56,142 64,128 Z"/>
      <path d="M148,112 Q162,120 156,138 Q144,142 136,128 Z"/>
    </g>
    <!-- feet -->
    <path d="M84,156 L84,178 M84,178 L76,184 M84,178 L92,184 M84,178 L84,186" fill="none" stroke="#FF8A2E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M116,156 L116,178 M116,178 L108,184 M116,178 L124,184 M116,178 L116,186" fill="none" stroke="#FF8A2E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- tuft -->
    <path d="M86,66 Q84,50 93,54 Q98,46 103,54 Q112,50 110,66 Z" fill="#FFC21F" stroke="#3d2a1c" stroke-width="3" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="100" cy="116" rx="54" ry="52" fill="#FFCD33" stroke="#3d2a1c" stroke-width="3.4"/>
    <!-- belly -->
    <ellipse cx="100" cy="132" rx="34" ry="30" fill="#FFE7A0"/>
    <!-- wings (relaxed) -->
    <path d="M52,112 Q38,120 44,138 Q56,142 64,128 Q60,116 52,112 Z" fill="#FFB300" stroke="#3d2a1c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M148,112 Q162,120 156,138 Q144,142 136,128 Q140,116 148,112 Z" fill="#FFB300" stroke="#3d2a1c" stroke-width="3" stroke-linejoin="round"/>
    <!-- cheeks -->
    <ellipse cx="72" cy="122" rx="11" ry="7.5" fill="#ff7ba0" opacity="0.8"/>
    <ellipse cx="128" cy="122" rx="11" ry="7.5" fill="#ff7ba0" opacity="0.8"/>
    <!-- beak -->
    <path d="M92,128 Q100,124 108,128 Q104,136 100,137 Q96,136 92,128 Z" fill="#FF8A2E" stroke="#3d2a1c" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- closed sleepy eyes -->
    <path d="M74,108 Q82,116 90,108" fill="none" stroke="#2a1e16" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M110,108 Q118,116 126,108" fill="none" stroke="#2a1e16" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M90,108 L94,111 M110,108 L106,111" fill="none" stroke="#2a1e16" stroke-width="2.6" stroke-linecap="round"/>
    <!-- highlight -->
    <ellipse cx="78" cy="88" rx="13" ry="9" fill="#ffffff" opacity="0.3" transform="rotate(-18 78 88)"/>
  </g>
  <!-- zzz halo -->
  <g stroke="#ffffff" stroke-width="7.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M136,66 L149,66 L136,79 L149,79"/>
    <path d="M152,44 L167,44 L152,59 L167,59"/>
    <path d="M170,24 L186,24 L170,41 L186,41"/>
  </g>
  <!-- zzz -->
  <g stroke="#5aa0cf" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M136,66 L149,66 L136,79 L149,79"/>
    <path d="M152,44 L167,44 L152,59 L167,59"/>
    <path d="M170,24 L186,24 L170,41 L186,41"/>
  </g>
</svg>
