<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ベンチ">
  <!-- white die-cut underlay -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="15" stroke-linejoin="round" stroke-linecap="round">
    <rect x="46" y="58" width="12" height="120" rx="5"/>
    <rect x="142" y="58" width="12" height="120" rx="5"/>
    <rect x="54" y="64" width="92" height="11" rx="5.5"/>
    <rect x="54" y="82" width="92" height="11" rx="5.5"/>
    <rect x="54" y="100" width="92" height="11" rx="5.5"/>
    <rect x="38" y="118" width="124" height="17" rx="8"/>
    <rect x="58" y="132" width="12" height="46" rx="5"/>
    <rect x="130" y="132" width="12" height="46" rx="5"/>
  </g>
  <!-- back frame posts / back legs -->
  <rect x="46" y="58" width="12" height="120" rx="5" fill="#8A5A32" stroke="#3d2a1c" stroke-width="3.2"/>
  <rect x="142" y="58" width="12" height="120" rx="5" fill="#8A5A32" stroke="#3d2a1c" stroke-width="3.2"/>
  <!-- back slats -->
  <rect x="54" y="64" width="92" height="11" rx="5.5" fill="#B0763F" stroke="#3d2a1c" stroke-width="3"/>
  <rect x="54" y="82" width="92" height="11" rx="5.5" fill="#B0763F" stroke="#3d2a1c" stroke-width="3"/>
  <rect x="54" y="100" width="92" height="11" rx="5.5" fill="#B0763F" stroke="#3d2a1c" stroke-width="3"/>
  <!-- front legs -->
  <rect x="58" y="132" width="12" height="46" rx="5" fill="#8A5A32" stroke="#3d2a1c" stroke-width="3.2"/>
  <rect x="130" y="132" width="12" height="46" rx="5" fill="#8A5A32" stroke="#3d2a1c" stroke-width="3.2"/>
  <!-- seat plank -->
  <rect x="38" y="118" width="124" height="17" rx="8" fill="#B98547" stroke="#3d2a1c" stroke-width="3.2"/>
  <!-- wood grain -->
  <path d="M46,126 L154,126" fill="none" stroke="#8A5A32" stroke-width="2.2" opacity="0.55"/>
  <path d="M60,70 L140,70 M60,88 L140,88 M60,106 L140,106" fill="none" stroke="#8A5A32" stroke-width="1.8" opacity="0.45"/>
  <!-- gloss -->
  <path d="M44,122 Q100,118 156,122" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.5"/>
</svg>
