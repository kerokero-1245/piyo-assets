<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="メリーゴーラウンド">
  <!-- white die-cut underlay -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <path d="M100,34 L36,88 Q100,100 164,88 Z"/>
    <circle cx="100" cy="24" r="7"/>
    <rect x="52" y="86" width="9" height="86" rx="4"/>
    <rect x="139" y="86" width="9" height="86" rx="4"/>
    <ellipse cx="100" cy="174" rx="66" ry="13"/>
    <ellipse cx="104" cy="132" rx="30" ry="19"/>
    <path d="M90,120 Q76,104 60,110 Q66,120 78,124 Z"/>
    <rect x="96" y="96" width="9" height="78" rx="4"/>
    <path d="M84,146 L78,166 M96,148 L94,168 M114,148 L118,168 M124,144 L130,164"/>
  </g>
  <!-- base platform -->
  <ellipse cx="100" cy="174" rx="66" ry="13" fill="#E8B84E" stroke="#3d2a1c" stroke-width="3.2"/>
  <path d="M38,172 A66,13 0 0 0 162,172" fill="none" stroke="#C7952F" stroke-width="2.4" opacity="0.6"/>
  <!-- side poles -->
  <rect x="52" y="86" width="9" height="84" rx="4" fill="#C9973A" stroke="#3d2a1c" stroke-width="3"/>
  <rect x="139" y="86" width="9" height="84" rx="4" fill="#C9973A" stroke="#3d2a1c" stroke-width="3"/>
  <!-- center pole (behind horse) -->
  <rect x="96" y="96" width="9" height="78" rx="4" fill="#E0B84E" stroke="#3d2a1c" stroke-width="3"/>
  <!-- horse legs -->
  <g fill="none" stroke="#3d2a1c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,146 L78,166" stroke="#F2ECE2" stroke-width="7"/>
    <path d="M96,148 L94,168" stroke="#F2ECE2" stroke-width="7"/>
    <path d="M114,148 L118,168" stroke="#F2ECE2" stroke-width="7"/>
    <path d="M124,144 L130,164" stroke="#F2ECE2" stroke-width="7"/>
  </g>
  <g fill="none" stroke="#3d2a1c" stroke-width="2.4" stroke-linecap="round">
    <path d="M84,146 L78,166"/>
    <path d="M96,148 L94,168"/>
    <path d="M114,148 L118,168"/>
    <path d="M124,144 L130,164"/>
  </g>
  <!-- hooves -->
  <g fill="#8A5A32" stroke="#3d2a1c" stroke-width="2">
    <circle cx="78" cy="166" r="4"/>
    <circle cx="94" cy="168" r="4"/>
    <circle cx="118" cy="168" r="4"/>
    <circle cx="130" cy="164" r="4"/>
  </g>
  <!-- horse tail -->
  <path d="M130,126 Q146,124 148,142 Q140,138 130,140 Z" fill="#FF9DC0" stroke="#3d2a1c" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- horse body -->
  <ellipse cx="104" cy="132" rx="30" ry="19" fill="#FBF6EE" stroke="#3d2a1c" stroke-width="3.2"/>
  <!-- horse neck + head -->
  <path d="M90,120 Q74,104 60,110 Q58,118 66,124 Q76,128 88,136 Z" fill="#FBF6EE" stroke="#3d2a1c" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- ears -->
  <path d="M63,108 Q60,100 66,100 Q68,106 66,110 Z" fill="#FBF6EE" stroke="#3d2a1c" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- saddle -->
  <path d="M92,116 Q104,110 118,118 L116,128 Q104,122 94,126 Z" fill="#FF6F91" stroke="#3d2a1c" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- mane -->
  <path d="M74,106 Q84,110 90,122 Q82,120 76,116 Q80,124 86,130 Q78,128 72,120 Z" fill="#FF9DC0" stroke="#3d2a1c" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="66" cy="114" r="3" fill="#2a1e16"/>
  <!-- roof -->
  <path d="M100,34 L36,88 Q100,100 164,88 Z" fill="#F0384A" stroke="#3d2a1c" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M100,34 L58,84 Q71,88 84,90 Z" fill="#FFFFFF"/>
  <path d="M100,34 L114,88 Q128,86 141,82 Z" fill="#FFFFFF"/>
  <path d="M100,34 L36,88 Q100,100 164,88 Z" fill="none" stroke="#3d2a1c" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M100,34 L84,90 M100,34 L114,88" fill="none" stroke="#3d2a1c" stroke-width="2.6"/>
  <!-- scallops -->
  <g fill="#FFE27A" stroke="#3d2a1c" stroke-width="2">
    <circle cx="52" cy="90" r="4"/>
    <circle cx="76" cy="95" r="4"/>
    <circle cx="100" cy="97" r="4"/>
    <circle cx="124" cy="95" r="4"/>
    <circle cx="148" cy="90" r="4"/>
  </g>
  <!-- finial -->
  <rect x="98" y="22" width="4" height="14" fill="#C9973A" stroke="#3d2a1c" stroke-width="1.6"/>
  <circle cx="100" cy="20" r="6.5" fill="#FFE27A" stroke="#3d2a1c" stroke-width="2.6"/>
</svg>
